<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img" aria-label="Esquema conceptual de huella de la estructura sin distribución interior">
 <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#dde1df" stroke-width="1"/></pattern></defs>
 <style>.shell{stroke:#263239;stroke-width:21;stroke-linecap:square;stroke-linejoin:miter;fill:none}.ghost{fill:none;stroke:#9fa9a7;stroke-width:3;stroke-dasharray:9 9}.small{font:bold 12px Arial,sans-serif;fill:#68777b;letter-spacing:1px}.big{font:900 30px Arial,sans-serif;fill:#263239;letter-spacing:-1px}</style>
 <rect width="980" height="650" fill="#fafaf7"/><rect x="40" y="90" width="900" height="500" fill="url(#grid)"/>
 <rect x="40" y="80" width="900" height="4" fill="#d8ae4e"/>
 <text x="42" y="53" class="big">BLOQUE / PATIO</text>
 <text x="650" y="53" class="small">VOLUMEN NO EJECUTIVO</text>
 <g class="shell"><path d="M155 170H770V325H580V510H155Z"/><path d="M580 325H770 M580 325V510" class="ghost"/><rect x="595" y="340" width="155" height="155" fill="none" stroke="#c6a75b" stroke-dasharray="5 6" stroke-width="2"/></g>
 <text x="42" y="620" class="small">MUROS ILUSTRATIVOS · NO DEFINE COMPONENTES SUMINISTRADOS</text>
 </svg>